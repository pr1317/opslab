name: Publish the sample report

# The published site is the interactive demo in web/, the static report
# `opslab try` writes, and the sample CSVs behind both. Everything generated is
# rebuilt from the current main here rather than trusted from the tree, so the
# published page cannot drift from the code that produced it.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Build the site
        run: |
          mkdir -p site
          cp web/index.html web/app.js web/opslab.js site/
          opslab export --out site/demo-data.js
          opslab try --out out/try
          cp out/try/report.html site/report.html
          cp out/try/sample_events.csv out/try/sample_cases.csv site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
